name: Check and deploy Seha

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  # Optional: form delivery stays unavailable until a handler is configured.
  PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
  PUBLIC_PRODUCT_INQUIRY_ENDPOINT: ${{ vars.PUBLIC_PRODUCT_INQUIRY_ENDPOINT }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_URL: https://seha-group.ru
      BASE_PATH: /seha-website/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Astro and TypeScript check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check
      - name: Lint JavaScript, TypeScript and Astro
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Check hosting configuration preservation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check Russian text formatting
        run: node --test scripts/russian-typography.test.mjs
      - name: Check PHP inquiry handler without sending email
        run: |
          find server/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php server/php/inquiry.test.php
          python3 scripts/test-inquiry-http.py
      - name: Install Chromium
        id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # ubuntu-24.04 already provides Chromium's runtime libraries. Avoid unrelated
        # font downloads from apt mirrors blocking browser checks and publication.
        run: npx playwright install chromium
      - name: Functional and accessibility tests under a Pages subpath
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          TEST_BASE_PATH: /seha-website/
          PLAYWRIGHT_OUTPUT_DIR: test-results/subpath
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/subpath
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/subpath/junit.xml
        run: npm test
      - name: Upload test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload tested build for inspection
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: subpath-build-output
          path: dist/
          retention-days: 7
          if-no-files-found: warn

  build-pages:
    needs: quality
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with the actual Pages origin and subpath
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build-pages
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-reg-ru:
    needs: quality
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: reg-ru
      url: https://seha-group.ru
    concurrency:
      group: reg-ru-deployment
      cancel-in-progress: false
    steps:
      - name: Check REG.RU connection settings
        id: connection
        env:
          FTP_SERVER: ${{ secrets.REG_RU_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.REG_RU_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.REG_RU_FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ vars.REG_RU_FTP_DIRECTORY }}
        shell: bash
        run: |
          if [[ -z "$FTP_SERVER" || -z "$FTP_USERNAME" || -z "$FTP_PASSWORD" || -z "$FTP_DIRECTORY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::REG.RU deployment is not connected. Add REG_RU_FTP_SERVER, REG_RU_FTP_USERNAME and REG_RU_FTP_PASSWORD secrets and the REG_RU_FTP_DIRECTORY variable."
            exit 0
          fi
          if [[ "$FTP_DIRECTORY" == "/" || "$FTP_DIRECTORY" == *".."* || "$FTP_DIRECTORY" != */ ]]; then
            echo "::error::Use the website directory with a trailing slash, or ./ for an FTP account restricted to the website."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.connection.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.connection.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: steps.connection.outputs.ready == 'true'
        run: npm ci
      - name: Build for seha-group.ru
        if: steps.connection.outputs.ready == 'true'
        env:
          SITE_URL: https://seha-group.ru
          BASE_PATH: /
          PUBLIC_FORM_ENDPOINT: /api/inquiry.php
          PUBLIC_PRODUCT_INQUIRY_ENDPOINT: /api/inquiry.php
        run: |
          npm run build
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("dist/deployment.json", JSON.stringify({commit: process.env.GITHUB_SHA, publishedAt: new Date().toISOString()}));'
      - name: Deploy mail handler and preserve SMTP settings
        if: steps.connection.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.REG_RU_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.REG_RU_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.REG_RU_FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ vars.REG_RU_FTP_DIRECTORY }}
        run: python3 scripts/deploy-inquiry.py
      - name: Publish changed files to REG.RU
        if: steps.connection.outputs.ready == 'true'
        # v4.4.0; pin the reviewed implementation used to access hosting credentials.
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.REG_RU_FTP_SERVER }}
          username: ${{ secrets.REG_RU_FTP_USERNAME }}
          password: ${{ secrets.REG_RU_FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./dist/
          server-dir: ${{ vars.REG_RU_FTP_DIRECTORY }}
          state-name: .seha-deploy-state.json
          dangerous-clean-slate: false
          timeout: 120000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.htaccess
            **/.env*
            **/.well-known/**
            api/**
            server/**
            **/*.php
            **/*.zip
      - name: Connect branded 404 pages
        if: steps.connection.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.REG_RU_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.REG_RU_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.REG_RU_FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ vars.REG_RU_FTP_DIRECTORY }}
        run: python3 scripts/configure-reg-ru.py
      - name: Check published pages
        if: steps.connection.outputs.ready == 'true'
        shell: bash
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'https://seha-group.ru/api/private/config.php')
          test "$status" = '403'
          status=$(curl --silent --show-error --header 'Origin: https://seha-group.ru' --output /dev/null --write-out '%{http_code}' 'https://seha-group.ru/api/inquiry.php')
          test "$status" = '405'
          for path in /ru/ /en/ /ru/products/; do
            curl --fail --silent --show-error --retry 3 --retry-delay 5 "https://seha-group.ru$path" --output /dev/null
          done
          for path in /seha-missing-page-check/ /ru/seha-missing-page-check/ /en/seha-missing-page-check/; do
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/seha-404.html" --write-out '%{http_code}' "https://seha-group.ru$path")
            test "$status" = '404'
            grep -q 'id="error-content"' "$RUNNER_TEMP/seha-404.html"
          done
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "https://seha-group.ru/deployment.json?run=${{ github.run_id }}-${{ github.run_attempt }}" --output "$RUNNER_TEMP/seha-deployment.json"
          node --input-type=module -e 'import fs from "node:fs"; const deployed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/seha-deployment.json", "utf8")); if (deployed.commit !== process.env.GITHUB_SHA) throw new Error("Published site does not match this commit"); console.log("Published commit verified:", deployed.commit);'
