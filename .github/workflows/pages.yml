name: Deploy Seha to GitHub Pages
# Rebuild nested product routes from the current Sites snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run quality checks
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare project-site paths
        shell: bash
        run: |
          rm -rf _site
          cp -R dist/. _site/
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          find _site -type f -name '*.html' -print0 | xargs -0 sed -i -E "s#(href|src|action)=\"/#\\1=\"$BASE_PATH/#g"
          find _site -type f -name '*.css' -print0 | xargs -0 sed -i -E "s#url\\('/#url('$BASE_PATH/#g; s#url\\(\"/#url(\"$BASE_PATH/#g"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
